name: research-tests

# Minimal CI for the State Validation Lab research fixtures.
#
# This workflow ONLY runs deterministic, owner-local unit tests and
# validates Evidence Ledger artifacts. It performs no deployment, no
# runtime activation, and grants no production authorization. A green
# run means "tests executed and evidence is well-formed", nothing more.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run deterministic research tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Validate Evidence Ledger artifacts
        run: PYTHONPATH=src python3 -m unittest tests.test_evidence_ledger_schema -v
